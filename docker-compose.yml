services:
  neo4j:
    # Pinned to a Graphiti-compatible 5.x line (APOC ships in 5.26 image variants).
    image: neo4j:5.26
    container_name: llama-index-poc-neo4j
    restart: unless-stopped
    ports:
      # 7474 = HTTP browser UI, 7687 = Bolt protocol used by Graphiti
      - "7474:7474"
      - "7687:7687"
    environment:
      # Default dev creds; override in your .env if you want.
      # Override via env: e.g. NEO4J_AUTH=neo4j/your_password docker compose up -d neo4j
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/password}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  neo4j_data:
  neo4j_logs:
